name: Build standalone app

# Builds a double-clickable FL Auto Bot binary for each OS and uploads it as a
# downloadable artifact. Run it from the Actions tab ("Run workflow"), or push a
# v* tag. PyInstaller can't cross-compile, so each binary is built on its own OS.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: FLAutoBot-windows
            binary: FLAutoBot.exe
          - os: macos-latest
            artifact: FLAutoBot-macos
            binary: FLAutoBot
          - os: ubuntu-latest
            artifact: FLAutoBot-linux
            binary: FLAutoBot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # python-rtmidi (live MIDI) builds from source on Linux and needs ALSA.
      - name: Install ALSA/JACK headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libjack-dev

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller mido anthropic

      # Optional: bundle live-MIDI support. If the wheel/build fails on a runner,
      # the app is still built (live streaming just won't be available there).
      - name: Install live-MIDI backend (best effort)
        continue-on-error: true
        run: pip install python-rtmidi

      - name: Build the executable
        run: python packaging/build_exe.py

      - name: Upload ${{ matrix.binary }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.binary }}
          if-no-files-found: error
