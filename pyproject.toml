[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flautobot"
version = "0.1.0"
description = "A bot that algorithmically composes complete songs and gets them into FL Studio (MIDI export, live MIDI streaming, and a native Piano Roll script)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "FL Auto Bot" }]
keywords = ["fl-studio", "midi", "music", "generative", "composition", "daw", "bot"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]
dependencies = ["mido>=1.3.0"]

[project.optional-dependencies]
live = ["python-rtmidi>=1.5.0"]
dev = ["pytest>=7.0"]

[project.scripts]
flautobot = "flautobot.cli:main"

[tool.setuptools.packages.find]
include = ["flautobot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
